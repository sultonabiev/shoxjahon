<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Shoxjahon AI v8.5 - Deep Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: -apple-system, sans-serif; background: #f2f2f7; color: #1c1c1e; }
        .ios-card { background: white; border-radius: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .btn-primary { background: #007aff; color: white; border-radius: 20px; padding: 18px; font-weight: 700; transition: 0.2s; }
        .btn-primary:active { transform: scale(0.97); opacity: 0.9; }
        .log-entry { font-family: monospace; font-size: 11px; border-left: 3px solid #007aff; padding-left: 10px; margin: 4px 0; color: #636e72; }
    </style>
</head>
<body class="p-4 pb-12">

<div class="max-w-md mx-auto">
    <div class="flex items-center justify-between mb-8 pt-4">
        <h1 class="text-3xl font-black italic">Shoxjahon <span class="text-blue-600">AI</span></h1>
        <div class="px-3 py-1 bg-blue-100 text-blue-600 rounded-full text-[10px] font-bold uppercase tracking-widest">v8.5 Final</div>
    </div>

    <div class="ios-card p-6 mb-6">
        <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Дата анализа</label>
        <input type="date" id="reportDate" class="w-full bg-gray-100 border-none rounded-2xl p-4 text-xl font-bold outline-none mt-1 mb-6 focus:ring-2 ring-blue-500 transition-all">
        <button id="runAi" class="btn-primary w-full shadow-lg shadow-blue-200 flex items-center justify-center gap-3">
            <i class="fa-solid fa-bolt-lightning"></i> СИНХРОНИЗИРОВАТЬ
        </button>
    </div>

    <div id="statusLog" class="hidden mb-6 p-5 bg-white/60 rounded-[2rem] border border-white shadow-inner backdrop-blur-md">
        <div id="logContent" class="space-y-1 max-h-40 overflow-y-auto pr-2"></div>
    </div>

    <div id="loader" class="hidden py-12 text-center">
        <div class="inline-block animate-spin text-4xl text-blue-600 mb-4"><i class="fa-solid fa-circle-notch"></i></div>
        <p class="font-bold text-gray-400 text-xs tracking-widest uppercase">Сбор данных из PMS и Кассы...</p>
    </div>

    <div id="resultBox" class="hidden space-y-4">
        <div id="aiResponse"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // Инициализация базы данных
    const fbApp = initializeApp({ databaseURL: "https://shoxjahon-kassa-default-rtdb.asia-southeast1.firebasedatabase.app" });
    const db = getDatabase(fbApp);

    const DEEPSEEK_KEY = "sk-3b031edec8bf4466887f0eb9cc41b7af";
    const HOTELS = [
        { id: "509331", key: "637a565e-7e4b-4692-8041-6b50d2b9a7ac", name: "Centrum" },
        { id: "500875", key: "31a3f8a2-e540-482b-bb00-9c32ba30985b", name: "Shoxjahon" }
    ];

    document.getElementById('reportDate').valueAsDate = new Date();

    function addLog(msg) {
        const container = document.getElementById('logContent');
        container.innerHTML += `<div class="log-entry"><span>${new Date().toLocaleTimeString()}</span> ${msg}</div>`;
        container.scrollTop = container.scrollHeight;
    }

    // ВЕРСИЯ 8.5: Улучшенный поиск через lastModification
    async function fetchExelyData(selectedDate) {
        let stats = { revenue: 0, occupancy: 0, checkins: 0 };
        const proxy = "https://corsproxy.io/?";
        
        // Берем изменения за последние 3 дня, чтобы гарантированно найти активные брони
        const modDate = new Date();
        modDate.setDate(modDate.getDate() - 3);
        const lastMod = modDate.toISOString().split('T')[0] + "T00:00:00Z";

        for (const hotel of HOTELS) {
            addLog(`Связь с ${hotel.name} (ID: ${hotel.id})...`);
            try {
                // Запрос всех изменений по API ключу и ID отеля
                const targetUrl = `https://connect.hopenapi.com/api/v1/reservations?propertyId=${hotel.id}&lastModification=${lastMod}`;
                
                const response = await fetch(proxy + encodeURIComponent(targetUrl), {
                    method: 'GET',
                    headers: { 
                        "X-API-KEY": hotel.key, 
                        "Accept": "application/json" 
                    }
                });

                if (!response.ok) throw new Error("API Error");

                const data = await response.json();
                const reservations = data.reservations || [];
                addLog(`${hotel.name}: Обработано ${reservations.length} записей.`);

                reservations.forEach(r => {
                    if (r.status !== 'Cancelled') {
                        const start = r.stayInterval.start.split('T')[0];
                        const end = r.stayInterval.end.split('T')[0];
                        
                        // Проверяем, проживает ли гость в выбранную дату
                        if (selectedDate >= start && selectedDate < end) {
                            stats.occupancy++;
                            // Расчет выручки за 1 ночь
                            const nights = Math.max(1, (new Date(end) - new Date(start)) / 86400000);
                            stats.revenue += (r.totalPrice?.amount / nights) || 0;
                            if (start === selectedDate) stats.checkins++;
                        }
                    }
                });
            } catch (err) {
                addLog(`Ошибка ${hotel.name}: Проверьте права доступа в Exely.`, true);
            }
        }
        return stats;
    }

    document.getElementById('runAi').onclick = async () => {
        const loader = document.getElementById('loader');
        const resBox = document.getElementById('resultBox');
        const logBox = document.getElementById('statusLog');
        const selDate = document.getElementById('reportDate').value;
        
        document.getElementById('logContent').innerHTML = '';
        logBox.classList.remove('hidden');
        loader.classList.remove('hidden'); resBox.classList.add('hidden');

        try {
            addLog("Загрузка данных из Firebase...");
            const [snap, exely] = await Promise.all([ get(ref(db, '/')), fetchExelyData(selDate) ]);
            
            const kData = snap.val() || {};
            // Объединение транзакций из всех веток
            let trans = [...Object.values(kData.transactions || {}), ...Object.values(kData.centrum_hotel?.transactions || {})];
            let filtered = trans.filter(t => new Date(t.timestamp).toLocaleDateString('en-CA') === selDate);

            const kirim = filtered.filter(t => t.type === 'Kirim').reduce((s,t)=>s+(t.amount||0),0);
            const inkas = filtered.filter(t => t.comment?.toLowerCase().includes('инкас')).reduce((s,t)=>s+(t.amount||0),0);
            const chiqim = filtered.filter(t => t.type === 'Chiqim').reduce((s,t)=>s+(t.amount||0),0) - inkas;

            addLog("DeepSeek AI формирует анализ...");
            const aiRes = await fetch('https://api.deepseek.com/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${DEEPSEEK_KEY}` },
                body: JSON.stringify({
                    model: "deepseek-chat",
                    messages: [
                        { role: "system", content: "Вы — Shoxjahon AI, эксперт-аналитик. Пишите на русском. Ответ давайте ТОЛЬКО в формате чистого HTML/Tailwind CSS. Используйте карточки, иконки и жирный шрифт. Не используйте Markdown блоки." },
                        { role: "user", content: `Проанализируй: Дата ${selDate}. Касса Приход: ${kirim}, Расход: ${chiqim}. Exely Доход: ${exely.revenue}, Занято номеров: ${exely.occupancy}, Заездов: ${exely.checkins}. Сравни данные кассы и PMS.` }
                    ]
                })
            });

            const aiData = await aiRes.json();
            document.getElementById('aiResponse').innerHTML = aiData.choices[0].message.content.replace(/```html|```/g, '');
            resBox.classList.remove('hidden');
            addLog("Отчет готов!");
        } catch (e) {
            addLog("Критическая ошибка синхронизации!");
        } finally {
            loader.classList.add('hidden');
        }
    };
</script>
</body>
</html>
