<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Shoxjahon AI v3.5 - Business Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background: #f2f2f7;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card { 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .ai-content { color: #1c1c1e; }
        .ai-content h2 { font-size: 1.4rem; font-weight: 800; color: #007aff; margin-bottom: 1rem; border-bottom: 2px solid #f2f2f7; padding-bottom: 8px; }
        .ai-content .card { background: #fff; border-radius: 16px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #efeff4; }
        .ai-content .stat-grid { display: grid; grid-cols: 2; gap: 10px; }
        .ios-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .ios-btn:active { transform: scale(0.95); opacity: 0.8; }
        .mode-active { background: #007aff !important; color: white !important; }
        .log-line { font-family: 'Courier New', monospace; font-size: 10px; border-left: 2px solid #007aff; padding-left: 6px; margin-bottom: 2px; }
    </style>
</head>
<body class="antialiased p-5">

<div class="max-w-md mx-auto">
    <div class="text-center py-6">
        <div class="inline-block bg-blue-100 text-blue-700 text-[10px] font-bold px-3 py-1 rounded-full mb-2">SHOXJAHON AI SYSTEM</div>
        <h1 class="text-3xl font-black text-gray-900">Dashboard</h1>
    </div>

    <div class="flex p-1 bg-gray-200/50 rounded-2xl mb-6">
        <button id="dayMode" class="mode-active ios-btn flex-1 py-3 rounded-xl text-sm font-bold">Kunlik</button>
        <button id="monthMode" class="ios-btn flex-1 py-3 rounded-xl text-sm font-bold text-gray-500">Oylik</button>
    </div>

    <div class="glass-card p-6 shadow-xl mb-6">
        <div id="daySelector" class="space-y-2">
            <p class="text-[11px] font-bold text-gray-400 uppercase ml-1">Hisobot kuni</p>
            <input type="date" id="reportDate" class="w-full bg-gray-50 border-none rounded-xl p-4 text-lg font-semibold outline-none ring-1 ring-gray-200">
        </div>

        <div id="monthSelectors" class="hidden grid grid-cols-2 gap-3 mt-2">
            <select id="selMonth" class="bg-gray-50 rounded-xl p-4 font-bold outline-none ring-1 ring-gray-200">
                <option value="0">Yanvar</option><option value="1">Fevral</option><option value="11">Dekabr</option>
            </select>
            <select id="selYear" class="bg-gray-50 rounded-xl p-4 font-bold outline-none ring-1 ring-gray-200">
                <option value="2025" selected>2025</option>
            </select>
        </div>

        <button id="runAi" class="ios-btn w-full mt-6 bg-blue-600 text-white py-4 rounded-3xl font-black text-lg shadow-lg shadow-blue-200 flex items-center justify-center gap-3">
            <i class="fa-solid fa-sparkles"></i> AI Tahlilni boshlash
        </button>
    </div>

    <div id="statusLog" class="hidden mb-6 p-4 bg-white rounded-2xl border border-gray-100 shadow-inner">
        <div id="logContent" class="space-y-1 max-h-32 overflow-y-auto"></div>
    </div>

    <div id="loader" class="hidden py-10 text-center">
        <div class="animate-bounce text-5xl text-blue-600 mb-4"><i class="fa-solid fa-brain"></i></div>
        <p class="font-bold text-gray-400">AI hisobot tayyorlamoqda...</p>
    </div>

    <div id="resultBox" class="hidden pb-20">
        <div id="aiResponse" class="ai-content"></div>
        
        <button onclick="window.print()" class="w-full mt-6 py-4 text-gray-400 text-sm font-bold border-2 border-dashed border-gray-200 rounded-2xl">
            <i class="fa-solid fa-download mr-2"></i> PDF yuklab olish
        </button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // Firebase Config
    const fbK = initializeApp({ databaseURL: "https://shoxjahon-kassa-default-rtdb.asia-southeast1.firebasedatabase.app" }, "k");
    const dbK = getDatabase(fbK);

    const DEEPSEEK_KEY = "sk-3b031edec8bf4466887f0eb9cc41b7af";
    const EXELY_KEYS = [
        "31a3f8a2-e540-482b-bb00-9c32ba30985b",
        "637a565e-7e4b-4692-8041-6b50d2b9a7ac"
    ];

    let currentMode = 'day';
    document.getElementById('reportDate').valueAsDate = new Date();

    function addLog(msg, error = false) {
        const logContent = document.getElementById('logContent');
        const line = document.createElement('div');
        line.className = `log-line ${error ? 'text-red-500' : 'text-blue-500'}`;
        line.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logContent.appendChild(line);
        logContent.scrollTop = logContent.scrollHeight;
    }

    // UI Logic
    document.getElementById('dayMode').onclick = () => {
        currentMode = 'day';
        document.getElementById('dayMode').classList.add('mode-active');
        document.getElementById('monthMode').classList.remove('mode-active');
        document.getElementById('daySelector').classList.remove('hidden');
        document.getElementById('monthSelectors').classList.add('hidden');
    }
    document.getElementById('monthMode').onclick = () => {
        currentMode = 'month';
        document.getElementById('monthMode').classList.add('mode-active');
        document.getElementById('dayMode').classList.remove('mode-active');
        document.getElementById('daySelector').classList.add('hidden');
        document.getElementById('monthSelectors').classList.remove('hidden');
    }

    // Exely with CORS Fix
    async function fetchExely(date) {
        let stats = { revenue: 0, count: 0 };
        const proxy = "https://corsproxy.io/?";

        for (const key of EXELY_KEYS) {
            addLog(`Exely ulanish: ${key.substring(0,5)}...`);
            try {
                const target = `https://connect.hopenapi.com/api/v1/reservations?lastModification=${date}T00:00:00Z`;
                const res = await fetch(proxy + encodeURIComponent(target), {
                    headers: { "X-API-KEY": key, "Accept": "application/json" }
                });
                const data = await res.json();
                const resList = data.reservations || [];
                addLog(`Hotel: ${resList.length} ta operatsiya.`);
                
                resList.forEach(r => {
                    if (r.status !== 'Cancelled') {
                        stats.revenue += r.totalPrice?.amount || 0;
                        stats.count++;
                    }
                });
            } catch (e) { addLog("Exely xatosi: " + e.message, true); }
        }
        return stats;
    }

    document.getElementById('runAi').onclick = async () => {
        const loader = document.getElementById('loader');
        const resBox = document.getElementById('resultBox');
        const selDate = document.getElementById('reportDate').value;

        document.getElementById('logContent').innerHTML = '';
        document.getElementById('statusLog').classList.remove('hidden');
        loader.classList.remove('hidden');
        resBox.classList.add('hidden');

        try {
            addLog("Firebase ma'lumotlari kutilmoqda...");
            const [kSnap, exely] = await Promise.all([ get(ref(dbK, '/')), fetchExely(selDate) ]);
            
            const kData = kSnap.val() || {};
            let allTrans = [...Object.values(kData.transactions || {}), ...Object.values(kData.centrum_hotel?.transactions || {})];
            
            let filtered = allTrans.filter(t => {
                const d = new Date(t.timestamp);
                return currentMode === 'day' 
                    ? d.toLocaleDateString('en-CA') === selDate
                    : d.getMonth() === parseInt(document.getElementById('selMonth').value);
            });

            const kirim = filtered.filter(t => t.type === 'Kirim').reduce((s,t)=>s+(t.amount||0),0);
            const inkas = filtered.filter(t => t.comment?.toLowerCase().includes('инкас')).reduce((s,t)=>s+(t.amount||0),0);
            const chiqim = filtered.filter(t => t.type === 'Chiqim').reduce((s,t)=>s+(t.amount||0),0) - inkas;

            addLog("AI tahlil boshlandi...");
            const aiRes = await fetch('https://api.deepseek.com/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${DEEPSEEK_KEY}` },
                body: JSON.stringify({
                    model: "deepseek-chat",
                    messages: [
                        {role: "system", content: "Sen professional mehmonxona tahlilchisisan. Javobni faqat chiroyli HTML formatida ber. Markdown ishlatma. Tailwind CSS klasslaridan foydalanib 'card' uslubida yarat. Emoji ishlating."},
                        {role: "user", content: `Analiz qil: Sana ${selDate}, Kirim ${kirim} UZS, Xarajat ${chiqim} UZS, Exely Summa ${exely.revenue} UZS, Bronlar ${exely.count} ta. Shoxjahon AI nomidan tavsiya ber.`}
                    ],
                    temperature: 0.7
                })
            });

            const data = await aiRes.json();
            let rawContent = data.choices[0].message.content;
            document.getElementById('aiResponse').innerHTML = rawContent.replace(/```html|```/g, '');
            
            resBox.classList.remove('hidden');
            window.scrollTo({ top: resBox.offsetTop, behavior: 'smooth' });
        } catch (e) { addLog("Xato: " + e.message, true); }
        finally { loader.classList.add('hidden'); }
    };
</script>

</body>
</html>
