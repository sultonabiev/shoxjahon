<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hotel Intelligence v14.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; color: #0f172a; }
        .glass-morphism { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .upload-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 2px dashed #e2e8f0; }
        .upload-card:hover { border-color: #3b82f6; transform: translateY(-2px); }
        .active-upload { border-style: solid; border-color: #10b981; background: #f0fdf4; }
        input[type="month"]::-webkit-calendar-picker-indicator { cursor: pointer; filter: invert(0.5); }
    </style>
</head>
<body class="antialiased min-h-screen">

<div class="max-w-6xl mx-auto px-4 py-8">
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-10">
        <div class="space-y-1">
            <h1 class="text-4xl font-extrabold tracking-tight text-slate-900 italic">SMART <span class="text-blue-600">AUDIT</span></h1>
            <p class="text-sm font-semibold text-slate-500 flex items-center gap-2">
                <span class="inline-block w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                Professional Tahlil Tizimi v14.0
            </p>
        </div>
        <div class="flex gap-4">
            <div class="glass-morphism p-3 px-6 rounded-2xl shadow-sm border border-slate-200">
                <p class="text-[10px] font-bold text-slate-400 uppercase">Jami xonalar</p>
                <p class="text-xl font-black text-slate-700">71 dona</p>
            </div>
        </div>
    </header>

    <div class="grid lg:grid-cols-3 gap-8">
        
        <div class="lg:col-span-1 space-y-6">
            <div class="glass-morphism p-6 rounded-[2.5rem] shadow-xl border border-white">
                <div class="mb-6">
                    <label class="text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2 block">Hisobot oyi</label>
                    <input type="month" id="reportMonth" class="w-full bg-slate-50 border-0 rounded-2xl p-4 text-lg font-bold outline-none ring-1 ring-slate-200 focus:ring-2 focus:ring-blue-500 transition-all">
                </div>

                <div class="space-y-6">
                    <div class="space-y-3">
                        <p class="text-xs font-black text-blue-600 uppercase flex items-center gap-2">
                            <i class="fa-solid fa-hotel"></i> Shoxjahon (51 xona)
                        </p>
                        <label for="shoxS" id="l-shoxS" class="upload-card block p-4 rounded-2xl cursor-pointer">
                            <div class="flex items-center gap-4 text-sm font-semibold text-slate-600">
                                <i class="fa-solid fa-file-excel text-xl"></i> Manbalar (XLS)
                            </div>
                            <input type="file" id="shoxS" class="hidden" accept=".xls,.xlsx">
                        </label>
                        <label for="shoxO" id="l-shoxO" class="upload-card block p-4 rounded-2xl cursor-pointer">
                            <div class="flex items-center gap-4 text-sm font-semibold text-slate-600">
                                <i class="fa-solid fa-globe text-xl"></i> OTA Kanallar
                            </div>
                            <input type="file" id="shoxO" class="hidden" accept=".xls,.xlsx">
                        </label>
                    </div>

                    <div class="space-y-3 pt-4 border-t border-slate-100">
                        <p class="text-xs font-black text-purple-600 uppercase flex items-center gap-2">
                            <i class="fa-solid fa-city"></i> Centrum (20 xona)
                        </p>
                        <label for="centS" id="l-centS" class="upload-card block p-4 rounded-2xl cursor-pointer">
                            <div class="flex items-center gap-4 text-sm font-semibold text-slate-600">
                                <i class="fa-solid fa-file-excel text-xl"></i> Manbalar (XLS)
                            </div>
                            <input type="file" id="centS" class="hidden" accept=".xls,.xlsx">
                        </label>
                        <label for="centO" id="l-centO" class="upload-card block p-4 rounded-2xl cursor-pointer">
                            <div class="flex items-center gap-4 text-sm font-semibold text-slate-600">
                                <i class="fa-solid fa-globe text-xl"></i> OTA Kanallar
                            </div>
                            <input type="file" id="centO" class="hidden" accept=".xls,.xlsx">
                        </label>
                    </div>
                </div>

                <button id="startAudit" class="w-full mt-8 bg-slate-900 text-white py-5 rounded-[2rem] font-black text-sm uppercase tracking-widest hover:bg-blue-600 shadow-2xl shadow-slate-200 transition-all flex items-center justify-center gap-3">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Tahlilni shakllantirish
                </button>
            </div>
        </div>

        <div class="lg:col-span-2 space-y-6">
            <div id="loader" class="hidden flex flex-col items-center justify-center py-24 glass-morphism rounded-[3rem]">
                <div class="relative">
                    <div class="w-20 h-20 border-4 border-blue-100 border-t-blue-600 rounded-full animate-spin"></div>
                    <div class="absolute inset-0 flex items-center justify-center font-bold text-blue-600">AI</div>
                </div>
                <p class="mt-6 text-sm font-black text-slate-400 uppercase tracking-[0.3em]">Hujjatlar o'qilmoqda...</p>
            </div>

            <div id="results" class="hidden space-y-6 animate-in fade-in slide-in-from-bottom-8 duration-700">
                <div id="aiResponse" class="prose prose-slate max-w-none"></div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const fb = initializeApp({ databaseURL: "https://shoxjahon-kassa-default-rtdb.asia-southeast1.firebasedatabase.app" });
    const db = getDatabase(fb);
    const DEEPSEEK_KEY = "sk-3b031edec8bf4466887f0eb9cc41b7af";

    let dataStore = { shoxS: null, shoxO: null, centS: null, centO: null };

    function bindUI(id, key, labelId) {
        document.getElementById(id).onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
                dataStore[key] = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
                const lbl = document.getElementById(labelId);
                lbl.classList.add('active-upload');
                lbl.querySelector('div').innerHTML = `<i class="fa-solid fa-circle-check text-green-500"></i> Fayl o'qildi`;
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        };
    }

    bindUI('shoxS', 'shoxS', 'l-shoxS'); bindUI('shoxO', 'shoxO', 'l-shoxO');
    bindUI('centS', 'centS', 'l-centS'); bindUI('centO', 'centO', 'l-centO');

    document.getElementById('startAudit').onclick = async () => {
        const month = document.getElementById('reportMonth').value;
        if (!month) return alert("Oyni tanlang");

        document.getElementById('loader').classList.remove('hidden');
        document.getElementById('results').classList.add('hidden');

        try {
            const snap = await get(ref(db, '/'));
            const dbVal = snap.val() || {};
            const allT = [...Object.values(dbVal.transactions || {}), ...Object.values(dbVal.centrum_hotel?.transactions || {})];
            
            const monthT = allT.filter(t => {
                const d = t.timestamp ? (typeof t.timestamp === 'number' ? new Date(t.timestamp).toISOString() : String(t.timestamp)) : '';
                return d.startsWith(month);
            });

            const kIn = monthT.filter(t => t.type === 'Kirim').reduce((s,t) => s + (Number(t.amount)||0), 0);
            const kOut = monthT.filter(t => t.type === 'Chiqim').reduce((s,t) => s + (Number(t.amount)||0), 0);

            const pack = (arr) => arr ? arr.slice(0, 70).map(r => r.join(' | ')).join('\n') : "N/A";

            const prompt = `Siz Shoxjahon (51 xona) va Centrum (20 xona) mehmonxonalari uchun oliy darajadagi moliyaviy direktorsiz.
            Oy: ${month}.
            KASSA (Firebase): Kirim=${kIn.toLocaleString()} UZS, Chiqim=${kOut.toLocaleString()} UZS.
            
            EXCEL MA'LUMOTLARI:
            Shoxjahon Manbalar: ${pack(dataStore.shoxS)}
            Shoxjahon OTA: ${pack(dataStore.shoxO)}
            Centrum Manbalar: ${pack(dataStore.centS)}
            Centrum OTA: ${pack(dataStore.centO)}

            TAHLIL TALABLARI:
            1. Javob FAQAT O'ZBEK TILIDA.
            2. Har bir mehmonxona uchun alohida: Jami daromad, Occupancy % (Xonalar sonidan kelib chiqib), ADR va RevPAR.
            3. OTA vs DIRECT: Booking, Ostrovok va Telefon orqali sotuvlar ulushini foizda chiqarish.
            4. KASSA VS PMS: Kassadagi pul va Exely'dagi daromad farqi faktlarini ko'rsatish.
            5. XULOSA: Qaysi kanaldan ko'proq foyda ko'rilayotgani va keyingi oy uchun 3 ta aniq tavsiya.
            
            DIZAYN (HTML/Tailwind):
            - Progress bar ishlatilsin.
            - Muhim raqamlar "stat-card" formatida bo'lsin.
            - Mobil va Desktopga mos chiroyli vizualizatsiya. Markdown ishlatmang.`;

            const res = await fetch('https://api.deepseek.com/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${DEEPSEEK_KEY}` },
                body: JSON.stringify({ model: "deepseek-chat", messages: [{ role: "user", content: prompt }] })
            });

            const aiData = await res.json();
            document.getElementById('aiResponse').innerHTML = aiData.choices[0].message.content.replace(/```html|```/g, '');
            document.getElementById('results').classList.remove('hidden');

        } catch (e) {
            alert("Xatolik: " + e.message);
        } finally {
            document.getElementById('loader').classList.add('hidden');
        }
    };
</script>
</body>
</html>
