<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Shoxjahon AI - Business Control Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background: #f2f2f7;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .safe-top { padding-top: env(safe-area-inset-top); }
        .glass-card { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-radius: 24px;
        }
        .ai-content h3 { font-size: 1.3rem; font-weight: 700; color: #007aff; margin: 1.2rem 0 0.5rem; display: flex; align-items: center; gap: 8px; }
        .ai-content p { line-height: 1.6; color: #1c1c1e; margin-bottom: 0.8rem; font-size: 1.05rem; }
        .ai-content ul { margin-bottom: 1rem; list-style: none; padding-left: 5px; }
        .ai-content li { margin-bottom: 5px; position: relative; padding-left: 20px; }
        .ai-content li::before { content: "•"; position: absolute; left: 0; color: #007aff; font-weight: bold; }
        
        .ios-btn { transition: all 0.2s ease; }
        .ios-btn:active { transform: scale(0.96); opacity: 0.7; }
        .mode-active { background: #007aff !important; color: white !important; box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3); }
        
        .log-entry { font-family: 'Courier New', Courier, monospace; font-size: 11px; border-left: 2px solid #ddd; padding-left: 8px; margin-bottom: 4px; }
        .loading-pulse { animation: pulse 1.5s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    </style>
</head>
<body class="antialiased">

<div class="max-w-md mx-auto px-5 safe-top">
    <div class="py-8 text-center">
        <div class="inline-block bg-blue-600 text-white text-[10px] font-bold px-3 py-1 rounded-full mb-2">HOTEL MANAGEMENT AI</div>
        <h1 class="text-3xl font-extrabold tracking-tight text-black">Shoxjahon <span class="text-blue-600">AI</span></h1>
        <p class="text-gray-500 text-sm mt-1">Exely & Firebase Integration</p>
    </div>

    <div class="flex p-1 bg-gray-200/50 rounded-2xl mb-6">
        <button id="dayMode" class="mode-active ios-btn flex-1 py-3 rounded-xl text-sm font-semibold">Kunlik</button>
        <button id="monthMode" class="ios-btn flex-1 py-3 rounded-xl text-sm font-semibold text-gray-600">Oylik</button>
    </div>

    <div class="glass-card p-6 shadow-sm mb-4 border border-white/40">
        <div id="daySelector" class="space-y-4">
            <label class="text-[11px] font-bold text-gray-400 uppercase ml-1">Hisobot sanasi</label>
            <input type="date" id="reportDate" class="w-full bg-gray-100 border-none rounded-xl p-4 text-lg font-medium outline-none focus:ring-2 ring-blue-500">
        </div>

        <div id="monthSelectors" class="hidden space-y-4">
            <div class="grid grid-cols-2 gap-3">
                <select id="selMonth" class="bg-gray-100 border-none rounded-xl p-4 text-lg font-medium outline-none">
                    <option value="0">Yanvar</option><option value="1">Fevral</option><option value="2">Mart</option>
                    <option value="3">Aprel</option><option value="4">May</option><option value="5">Iyun</option>
                    <option value="6">Iyul</option><option value="7">Avgust</option><option value="8">Sentabr</option>
                    <option value="9">Oktabr</option><option value="10">Noyabr</option><option value="11">Dekabr</option>
                </select>
                <select id="selYear" class="bg-gray-100 border-none rounded-xl p-4 text-lg font-medium outline-none">
                    <option value="2024">2024</option><option value="2025" selected>2025</option>
                </select>
            </div>
        </div>

        <button id="runAi" class="ios-btn w-full mt-6 bg-black text-white py-4 rounded-3xl font-bold text-lg shadow-xl flex items-center justify-center gap-3">
            <i class="fa-solid fa-wand-magic-sparkles text-blue-400"></i>
            Tahlilni yaratish
        </button>
    </div>

    <div id="statusLog" class="hidden mb-6 p-4 bg-white rounded-2xl border border-gray-200 text-gray-700 shadow-inner">
        <div class="flex justify-between items-center mb-2 border-b pb-2">
            <span class="text-[10px] font-bold text-gray-400 uppercase">Tizim Loglari</span>
            <div id="logLoader" class="loading-pulse w-2 h-2 bg-blue-500 rounded-full"></div>
        </div>
        <div id="logContent" class="space-y-1"></div>
    </div>

    <div id="loader" class="hidden py-10 text-center">
        <div class="loading-pulse text-5xl text-blue-600 mb-4">
            <i class="fa-solid fa-brain"></i>
        </div>
        <p class="text-black font-bold">DeepSeek AI tahlil qilmoqda...</p>
    </div>

    <div id="resultBox" class="hidden mb-12">
        <div class="glass-card p-8 shadow-2xl border border-blue-100">
            <div id="aiResponse" class="ai-content"></div>
            <div class="mt-8 pt-6 border-t border-gray-100 flex justify-between items-center">
                <span class="text-[10px] text-gray-400 italic">Shoxjahon AI v3.5 (DeepSeek-V3)</span>
                <button onclick="window.print()" class="text-blue-600 text-sm font-medium"><i class="fa-solid fa-file-pdf mr-1"></i> Saqlash</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // Инициализация баз данных
    const fbK = initializeApp({ databaseURL: "https://shoxjahon-kassa-default-rtdb.asia-southeast1.firebasedatabase.app" }, "k");
    const fbH = initializeApp({ databaseURL: "https://shoxjahon-hr-default-rtdb.asia-southeast1.firebasedatabase.app" }, "h");
    const dbK = getDatabase(fbK);
    const dbH = getDatabase(fbH);

    const DEEPSEEK_KEY = "sk-3b031edec8bf4466887f0eb9cc41b7af";
    const EXELY_KEYS = [
        "31a3f8a2-e540-482b-bb00-9c32ba30985b",
        "637a565e-7e4b-4692-8041-6b50d2b9a7ac"
    ];

    let currentMode = 'day';
    document.getElementById('reportDate').valueAsDate = new Date();

    // UI Функции
    function addLog(msg, type = 'info') {
        const logContent = document.getElementById('logContent');
        const colors = { info: 'text-gray-600', success: 'text-green-600', error: 'text-red-600', wait: 'text-blue-500' };
        const entry = document.createElement('div');
        entry.className = `log-entry ${colors[type]}`;
        entry.innerHTML = `<span>[${new Date().toLocaleTimeString()}]</span> ${msg}`;
        logContent.appendChild(entry);
    }

    // Переключение режимов
    document.getElementById('dayMode').onclick = () => { 
        currentMode = 'day'; 
        document.getElementById('dayMode').className = 'mode-active ios-btn flex-1 py-3 rounded-xl text-sm font-semibold';
        document.getElementById('monthMode').className = 'ios-btn flex-1 py-3 rounded-xl text-sm font-semibold text-gray-600';
        document.getElementById('daySelector').classList.remove('hidden');
        document.getElementById('monthSelectors').classList.add('hidden');
    };
    document.getElementById('monthMode').onclick = () => { 
        currentMode = 'month'; 
        document.getElementById('monthMode').className = 'mode-active ios-btn flex-1 py-3 rounded-xl text-sm font-semibold';
        document.getElementById('dayMode').className = 'ios-btn flex-1 py-3 rounded-xl text-sm font-semibold text-gray-600';
        document.getElementById('daySelector').classList.add('hidden');
        document.getElementById('monthSelectors').classList.remove('hidden');
    };

    // Оптимизированный запрос к Exely
    async function fetchExelyMetrics(date) {
        let metrics = { revenue: 0, count: 0, cancelled: 0 };
        for (let i = 0; i < EXELY_KEYS.length; i++) {
            addLog(`Hotel ${i+1} Exely API dan ma'lumot kutilmoqda...`, 'wait');
            try {
                const response = await fetch(`https://connect.hopenapi.com/api/v1/reservations?lastModification=${date}T00:00:00Z`, {
                    headers: { "X-API-KEY": EXELY_KEYS[i], "Accept": "application/json" }
                });
                const data = await response.json();
                const reservations = data.reservations || [];
                addLog(`Hotel ${i+1}: ${reservations.length} ta operatsiya topildi.`, 'success');

                reservations.forEach(res => {
                    if (res.status === 'Cancelled') metrics.cancelled++;
                    else {
                        metrics.revenue += res.totalPrice?.amount || 0;
                        metrics.count++;
                    }
                });
            } catch (err) {
                addLog(`Hotel ${i+1} ulanishda xato: ${err.message}`, 'error');
            }
        }
        return metrics;
    }

    // Главная функция
    document.getElementById('runAi').onclick = async () => {
        const loader = document.getElementById('loader');
        const resBox = document.getElementById('resultBox');
        const statusLog = document.getElementById('statusLog');
        const logContent = document.getElementById('logContent');
        const selectedDate = document.getElementById('reportDate').value;

        // Reset UI
        logContent.innerHTML = '';
        statusLog.classList.remove('hidden');
        loader.classList.remove('hidden');
        resBox.classList.add('hidden');

        try {
            addLog("Firebase ma'lumotlar bazasiga ulanish...", 'wait');
            const [kSnap, exely] = await Promise.all([
                get(ref(dbK, '/')),
                fetchExelyMetrics(selectedDate)
            ]);

            const kData = kSnap.val() || {};
            addLog("Kassa ma'lumotlari tahlil qilinmoqda...", 'success');

            // Расчет финансов
            let allTrans = [...Object.values(kData.transactions || {}), ...Object.values(kData.centrum_hotel?.transactions || {})];
            let filtered = allTrans.filter(t => {
                const d = new Date(t.timestamp);
                return currentMode === 'day' 
                    ? d.toLocaleDateString('en-CA') === selectedDate
                    : d.getMonth() === parseInt(document.getElementById('selMonth').value) && d.getFullYear() === parseInt(document.getElementById('selYear').value);
            });

            const kirim = filtered.filter(t => t.type === 'Kirim').reduce((s,t)=>s+(t.amount||0),0);
            const inkas = filtered.filter(t => t.comment?.toLowerCase().includes('инкас')).reduce((s,t)=>s+(t.amount||0),0);
            const chiqim = filtered.filter(t => t.type === 'Chiqim').reduce((s,t)=>s+(t.amount||0),0) - inkas;

            addLog("DeepSeek AI ga so'rov yuborilmoqda...", 'wait');

            const prompt = `
                Sana: ${selectedDate}. Hisobot turi: ${currentMode}.
                
                MOLIYAVIY KO'RSATKICHLAR:
                - Kassaga haqiqiy kirim: ${kirim.toLocaleString()} UZS.
                - Jami xarajatlar (inkassatsiyasiz): ${chiqim.toLocaleString()} UZS.
                - Sof kassa foydasi: ${(kirim - chiqim).toLocaleString()} UZS.
                
                EXELY PMS (BRONLAR):
                - Jami bronlar summasi (Exely): ${exely.revenue.toLocaleString()} UZS.
                - Yangi/O'zgargan bronlar soni: ${exely.count} ta.
                - Bekor qilinganlar: ${exely.cancelled} ta.

                VAZIFA:
                1. Kassadagi pul va Exely'dagi bronlar summasini solishtir.
                2. Xarajatlar balansini tekshir.
                3. Biznesni rivojlantirish uchun 3 ta aniq maslahat ber.
                Format: Professional, kreativ, emoji bilan, faqat HTML.
            `;

            const aiRes = await fetch('https://api.deepseek.com/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${DEEPSEEK_KEY}` },
                body: JSON.stringify({
                    model: "deepseek-chat",
                    messages: [
                        {role:"system", content:"Sen Shoxjahon Hotel bosh tahlilchisisan. Ma'lumotlarni tahlil qilib, foydani oshirish yo'llarini ko'rsatasan."},
                        {role:"user", content: prompt}
                    ],
                    temperature: 0.7
                })
            });

            const result = await aiRes.json();
            document.getElementById('aiResponse').innerHTML = result.choices[0].message.content;
            
            addLog("Tahlil tayyor!", 'success');
            resBox.classList.remove('hidden');
            window.scrollTo({ top: resBox.offsetTop, behavior: 'smooth' });

        } catch (e) {
            addLog("Xatolik: " + e.message, 'error');
            alert("Xato yuz berdi. Loglarni tekshiring.");
        } finally {
            loader.classList.add('hidden');
        }
    };
</script>
</body>
</html>
