<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Shoxjahon AI - Business Control Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background: #f2f2f7;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .safe-top { padding-top: env(safe-area-inset-top); }
        .glass-card { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-radius: 24px;
        }
        .ai-content h3 { font-size: 1.3rem; font-weight: 700; color: #007aff; margin: 1.2rem 0 0.5rem; display: flex; align-items: center; gap: 8px; }
        .ai-content p { line-height: 1.6; color: #1c1c1e; margin-bottom: 0.8rem; font-size: 1.05rem; }
        .ios-btn { transition: all 0.2s ease; }
        .ios-btn:active { transform: scale(0.96); opacity: 0.7; }
        .mode-active { background: #007aff !important; color: white !important; box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3); }
        .log-entry { font-family: monospace; font-size: 11px; margin-bottom: 2px; padding-left: 5px; border-left: 2px solid #007aff; }
        .loading-pulse { animation: pulse 1.5s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    </style>
</head>
<body class="antialiased">

<div class="max-w-md mx-auto px-5 safe-top">
    <div class="py-8 text-center">
        <div class="inline-block bg-blue-600 text-white text-[10px] font-bold px-3 py-1 rounded-full mb-2">HOTEL AI SYSTEM</div>
        <h1 class="text-3xl font-extrabold tracking-tight text-black">Shoxjahon <span class="text-blue-600">AI</span></h1>
    </div>

    <div class="flex p-1 bg-gray-200/50 rounded-2xl mb-6">
        <button id="dayMode" class="mode-active ios-btn flex-1 py-3 rounded-xl text-sm font-semibold">Kunlik</button>
        <button id="monthMode" class="ios-btn flex-1 py-3 rounded-xl text-sm font-semibold text-gray-600">Oylik</button>
    </div>

    <div class="glass-card p-6 shadow-sm mb-4 border border-white/40">
        <div id="daySelector" class="space-y-4">
            <label class="text-[11px] font-bold text-gray-400 uppercase ml-1">Sana</label>
            <input type="date" id="reportDate" class="w-full bg-gray-100 border-none rounded-xl p-4 text-lg font-medium outline-none">
        </div>

        <div id="monthSelectors" class="hidden space-y-4">
            <div class="grid grid-cols-2 gap-3">
                <select id="selMonth" class="bg-gray-100 border-none rounded-xl p-4 text-lg font-medium outline-none">
                    <option value="0">Yanvar</option><option value="1">Fevral</option><option value="2">Mart</option>
                    <option value="3">Aprel</option><option value="4">May</option><option value="5">Iyun</option>
                    <option value="6">Iyul</option><option value="7">Avgust</option><option value="8">Sentabr</option>
                    <option value="9">Oktabr</option><option value="10">Noyabr</option><option value="11">Dekabr</option>
                </select>
                <select id="selYear" class="bg-gray-100 border-none rounded-xl p-4 text-lg font-medium outline-none">
                    <option value="2025" selected>2025</option>
                </select>
            </div>
        </div>

        <button id="runAi" class="ios-btn w-full mt-6 bg-black text-white py-4 rounded-3xl font-bold text-lg shadow-xl flex items-center justify-center gap-3">
            <i class="fa-solid fa-wand-magic-sparkles text-blue-400"></i>
            Tahlilni boshlash
        </button>
    </div>

    <div id="statusLog" class="hidden mb-6 p-4 bg-white rounded-2xl border border-gray-200 text-gray-700 shadow-sm">
        <div class="text-[10px] font-bold text-gray-400 uppercase mb-2">Tizim holati</div>
        <div id="logContent" class="space-y-1 max-h-32 overflow-y-auto"></div>
    </div>

    <div id="loader" class="hidden py-10 text-center">
        <div class="loading-pulse text-5xl text-blue-600 mb-4">
            <i class="fa-solid fa-brain"></i>
        </div>
        <p class="text-black font-bold">DeepSeek AI tahlil qilmoqda...</p>
    </div>

    <div id="resultBox" class="hidden mb-12">
        <div class="glass-card p-8 shadow-2xl border border-blue-100">
            <div id="aiResponse" class="ai-content"></div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const fbK = initializeApp({ databaseURL: "https://shoxjahon-kassa-default-rtdb.asia-southeast1.firebasedatabase.app" }, "k");
    const dbK = getDatabase(fbK);

    const DEEPSEEK_KEY = "sk-3b031edec8bf4466887f0eb9cc41b7af";
    const EXELY_KEYS = [
        "31a3f8a2-e540-482b-bb00-9c32ba30985b",
        "637a565e-7e4b-4692-8041-6b50d2b9a7ac"
    ];

    let currentMode = 'day';
    document.getElementById('reportDate').valueAsDate = new Date();

    function addLog(msg, type = 'info') {
        const logContent = document.getElementById('logContent');
        const entry = document.createElement('div');
        entry.className = `log-entry ${type === 'error' ? 'text-red-600' : 'text-gray-600'}`;
        entry.innerHTML = `<span>[${new Date().toLocaleTimeString()}]</span> ${msg}`;
        logContent.appendChild(entry);
    }

    // UI Switches
    document.getElementById('dayMode').onclick = () => { 
        currentMode = 'day'; 
        document.getElementById('dayMode').classList.add('mode-active');
        document.getElementById('monthMode').classList.remove('mode-active');
        document.getElementById('daySelector').classList.remove('hidden');
        document.getElementById('monthSelectors').classList.add('hidden');
    };
    document.getElementById('monthMode').onclick = () => { 
        currentMode = 'month'; 
        document.getElementById('monthMode').classList.add('mode-active');
        document.getElementById('dayMode').classList.remove('mode-active');
        document.getElementById('daySelector').classList.add('hidden');
        document.getElementById('monthSelectors').classList.remove('hidden');
    };

    // CORS Proxy fetch for Exely
    async function getExelyMetrics(date) {
        let stats = { revenue: 0, count: 0 };
        const proxy = "https://corsproxy.io/?";

        for (let i = 0; i < EXELY_KEYS.length; i++) {
            addLog(`Hotel ${i+1} ma'lumotlari so'ralmoqda...`);
            try {
                const target = `https://connect.hopenapi.com/api/v1/reservations?lastModification=${date}T00:00:00Z`;
                const res = await fetch(proxy + encodeURIComponent(target), {
                    headers: { "X-API-KEY": EXELY_KEYS[i], "Accept": "application/json" }
                });
                const data = await res.json();
                const reservations = data.reservations || [];
                addLog(`Hotel ${i+1}: ${reservations.length} ta operatsiya olindi.`, 'success');

                reservations.forEach(r => {
                    if (r.status !== 'Cancelled') {
                        stats.revenue += r.totalPrice?.amount || 0;
                        stats.count++;
                    }
                });
            } catch (err) {
                addLog(`Hotel ${i+1} xatosi: ${err.message}`, 'error');
            }
        }
        return stats;
    }

    document.getElementById('runAi').onclick = async () => {
        const loader = document.getElementById('loader');
        const resBox = document.getElementById('resultBox');
        const logBox = document.getElementById('statusLog');
        const selectedDate = document.getElementById('reportDate').value;

        document.getElementById('logContent').innerHTML = '';
        logBox.classList.remove('hidden');
        loader.classList.remove('hidden');
        resBox.classList.add('hidden');

        try {
            addLog("Firebase ulanmoqda...");
            const [kSnap, exely] = await Promise.all([
                get(ref(dbK, '/')),
                getExelyMetrics(selectedDate)
            ]);

            const kData = kSnap.val() || {};
            let allTrans = [...Object.values(kData.transactions || {}), ...Object.values(kData.centrum_hotel?.transactions || {})];
            
            let filtered = allTrans.filter(t => {
                const d = new Date(t.timestamp);
                return currentMode === 'day' 
                    ? d.toLocaleDateString('en-CA') === selectedDate
                    : d.getMonth() === parseInt(document.getElementById('selMonth').value);
            });

            const kirim = filtered.filter(t => t.type === 'Kirim').reduce((s,t)=>s+(t.amount||0),0);
            const inkas = filtered.filter(t => t.comment?.toLowerCase().includes('инкас')).reduce((s,t)=>s+(t.amount||0),0);
            const chiqim = filtered.filter(t => t.type === 'Chiqim').reduce((s,t)=>s+(t.amount||0),0) - inkas;

            addLog("DeepSeek AI tahlil qilmoqda...");
            const aiRes = await fetch('https://api.deepseek.com/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${DEEPSEEK_KEY}` },
                body: JSON.stringify({
                    model: "deepseek-chat",
                    messages: [
                        {role:"system", content:"Sen Shoxjahon AI mehmonxona tahlilchisisan. O'zbek tilida, HTML formatda javob ber."},
                        {role:"user", content: `Sana: ${selectedDate}. Kirim: ${kirim}. Chiqim: ${chiqim}. Exely Revenue: ${exely.revenue}. Bronlar: ${exely.count}.`}
                    ]
                })
            });

            const result = await aiRes.json();
            document.getElementById('aiResponse').innerHTML = result.choices[0].message.content;
            resBox.classList.remove('hidden');
        } catch (e) {
            addLog("Xatolik: " + e.message, 'error');
        } finally {
            loader.classList.add('hidden');
        }
    };
</script>
</body>
</html>
